<!DOCTYPE html>
<html lang="kmr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARIA - Senior Executive Strategy Advisor</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .chat-container {
      width: 100%;
      max-width: 600px;
      background: #1e293b;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .chat-header {
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      text-align: center;
    }
    .chat-header h2 { margin: 0; color: #38bdf8; }
    .chat-header p { margin: 5px 0 0; color: #94a3b8; font-size: 0.9em; }
    .chat-box {
      height: 400px;
      overflow-y: auto;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #0f172a;
    }
    .message {
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 80%;
      line-height: 1.5;
    }
    .user-msg {
      background: #0284c7;
      color: white;
      align-self: flex-end;
    }
    .bot-msg {
      background: #334155;
      color: #f8fafc;
      align-self: flex-start;
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      outline: none;
    }
    button {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background: #0284c7;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }
    .mic-btn { background: #10b981; }
    .mic-btn:hover { background: #059669; }
    .mic-btn.recording { background: #ef4444; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h2>ARIA Advisor</h2>
    <p>Global Strategy & Financial Intelligence</p>
  </div>
  
  <div class="chat-box" id="chatBox">
    <div class="message bot-msg">
      سڵاو! من ئاریام، ڕاوێژکاری باڵای ستراتیژیی بازرگانی. چۆن دەتوانم هاوکاریت بکەم؟
    </div>
  </div>

  <div class="controls">
    <input type="text" id="userInput" placeholder="پەیامەکەت بنووسە یان مایکەکە بەکاربهێنە..." />
    <button class="mic-btn" id="micBtn">🎤</button>
    <button id="sendBtn">بنێرە</button>
  </div>
</div>

<script>
  const ELEVENLABS_API_KEY = "sk_c28b7d656dd706f1ee4dd5cd553f401835c7369b01e10ef6";
  const VOICE_ID = "21m00Tcm4TlvDq8ikWAM"; // دەنگی فرەزمان
  const FLOWISE_URL = "https://flowise-production-4c8d.up.railway.app/api/v1/prediction/YOUR_CHATFLOW_ID"; // بەستەری Flowiseـەکەت

  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');

  // فەنکشنی پەخشکردنی دەنگ بە ElevenLabs
  async function speakWithElevenLabs(text) {
    try {
      const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
        method: "POST",
        headers: {
          "Accept": "audio/mpeg",
          "Content-Type": "application/json",
          "xi-api-key": ELEVENLABS_API_KEY
        },
        body: JSON.stringify({
          text: text,
          model_id: "eleven_multilingual_v2",
          voice_settings: { stability: 0.5, similarity_boost: 0.75 }
        })
      });

      if (response.ok) {
        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        const audio = new Audio(audioUrl);
        audio.play();
      }
    } catch (err) {
      console.error("ElevenLabs Error:", err);
    }
  }

  function appendMessage(sender, text) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', sender === 'user' ? 'user-msg' : 'bot-msg');
    msgDiv.textContent = text;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    appendMessage('user', text);
    userInput.value = '';

    try {
      const res = await fetch(FLOWISE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: text })
      });
      const data = await res.json();
      const reply = data.text || data.json?.text || "ببورە، وەڵامەکە بەردەست نەبوو.";
      
      appendMessage('bot', reply);
      speakWithElevenLabs(reply); // تریگەرکردنی دەنگی ElevenLabs
    } catch (err) {
      appendMessage('bot', "خەتا لە بەستەرەکەدا ڕوویدا.");
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

  // بەشی مایک
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;

    micBtn.addEventListener('click', () => {
      recognition.start();
      micBtn.classList.add('recording');
    });

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      userInput.value = transcript;
      micBtn.classList.remove('recording');
      sendMessage();
    };

    recognition.onerror = () => micBtn.classList.remove('recording');
    recognition.onend = () => micBtn.classList.remove('recording');
  } else {
    micBtn.style.display = 'none';
  }
</script>

</body>
</html>
