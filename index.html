    <!-- Voice Status Indicator -->
    <div id="voice-status" class="hidden text-xs text-center text-amber-400 font-medium animate-pulse">
        🎙️ گوێم لێیە... بئاخڤە! (دوای وەستان، ئۆتۆماتیکی دەنێردرێت)
    </div>

    <form onsubmit="handleSend(event)" class="flex items-center gap-2">
        <!-- Mic Button -->
        <button type="button" id="mic-btn" onclick="toggleMic()" class="w-12 h-12 rounded-2xl bg-slate-800 hover:bg-indigo-600/30 border border-slate-700 text-slate-200 hover:text-indigo-400 flex items-center justify-center text-xl transition shadow-md shrink-0">
            🎙️
        </button>

        <!-- Text Input -->
        <input type="text" id="user-input" placeholder="پەیامەکەت بنووسە یان قسە لەگەڵ مایک بکه..." class="flex-1 bg-slate-950 border border-slate-800 focus:border-indigo-500 text-slate-100 placeholder-slate-500 text-sm rounded-2xl px-4 py-3 outline-none transition" autocomplete="off">

        <!-- Send Button -->
        <button type="submit" id="send-btn" class="w-12 h-12 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center text-lg transition shadow-lg shadow-indigo-600/30 shrink-0">
            🚀
        </button>
    </form>
</div>
