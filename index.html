<!-- Header -->
<header class="bg-slate-800 border-b border-slate-700 p-4 text-center shadow-lg flex items-center justify-between px-6">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xl shadow-md">
            🤖
        </div>
        <h1 class="text-xl font-bold text-indigo-400">Kurd AI</h1>
    </div>
    <div class="flex items-center gap-2">
        <button id="configKeyBtn" onclick="setApiKey()" class="text-xs bg-slate-700 hover:bg-slate-600 border border-slate-600 text-slate-200 px-3 py-1.5 rounded-lg transition">
            🔑 ڕێکخستنی API Key
        </button>
        <span class="text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-full">ئۆنلاین</span>
    </div>
</header>

<!-- Main Chat Area -->
<main id="chatBox" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 chat-scroll max-w-4xl mx-auto w-full">
    <!-- Welcome Message -->
    <div class="flex items-start gap-3 bg-slate-800/80 p-4 rounded-2xl border border-slate-700 max-w-xl">
        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-sm font-bold flex-shrink-0">
            AI
        </div>
        <div class="space-y-1">
            <p class="text-sm font-semibold text-indigo-300">Kurd AI</p>
            <p class="text-slate-200 text-sm leading-relaxed">
                سڵاو! بەخێر بێیت بۆ **Kurd AI**. من ئامادەم بۆ وەڵامدانەوەی پرسیارەکانت بە زمانی کوردی.
            </p>
        </div>
    </div>
</main>

<!-- Input Form -->
<footer class="bg-slate-800 border-t border-slate-700 p-4">
    <form id="chatForm" class="max-w-4xl mx-auto flex gap-2">
        <button 
            type="button" 
            id="micBtn" 
            onclick="toggleMic()"
            class="bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-xl transition flex items-center justify-center shadow-lg"
            title="قسەکردن بە مایک"
        >
            🎙️
        </button>
        <input 
            type="text" 
            id="userInput" 
            placeholder="پەیامەکەت لێرە بنووسە..." 
            class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition"
            required
        />
        <button 
            type="submit" 
            id="sendBtn"
            class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-xl transition flex items-center gap-2 shadow-lg hover:shadow-indigo-500/20 active:scale-95"
        >
            <span>ناردن</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 rotate-180" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
            </svg>
        </button>
    </form>
</footer>

<script>
    // API Key Storage (تۆمارکردن لە مۆبایل/کۆمپیو تەری خۆت)
    let GEMINI_API_KEY = localStorage.getItem('GEMINI_KEY') || '';

    function setApiKey() {
        const key = prompt("تکایە کلیلی Gemini APIەکە ت لێرە دابنێ:", GEMINI_API_KEY);
        if (key) {
            GEMINI_API_KEY = key.trim();
            localStorage.setItem('GEMINI_KEY', GEMINI_API_KEY);
            alert("کلیلەکە بە سەرکەوتوویی پاشەکەوت کرا!");
        }
    }

    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const chatBox = document.getElementById('chatBox');
    const sendBtn = document.getElementById('sendBtn');

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = userInput.value.trim();
        if (!text) return;

        if (!GEMINI_API_KEY) {
            setApiKey();
            if (!GEMINI_API_KEY) return;
        }

        appendMessage('user', text);
        userInput.value = '';

        const loadingId = appendLoading();

        try {
            const responseText = await callGeminiAPI(text);
            removeLoading(loadingId);
            appendMessage('ai', responseText);
            speakText(responseText);
        } catch (err) {
            removeLoading(loadingId);
            appendMessage('ai', '⚠️ ببورە، هەڵەیەک ڕوویدا لە پەیوەندیکردن بە Gemini API. تکایە دڵنیابەوە لە دروستی API Keyەکەت.');
            console.error(err);
        }
    });

    async function callGeminiAPI(promptText) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
        
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [{
                        text: "تۆ یاریدەدەری ژیریی دەستکردی بە ناوی Kurd AI. هەمیشە زۆر بە ئاسانی و ڕەوانی و بە زمانی کوردی (سۆرانی) وەڵام بدەرەوە.\n\nپرسیار: " + promptText
                    }]
                }]
            })
        });

        if (!response.ok) {
            throw new Error('API Error');
        }

        const data = await response.json();
        return data.candidates[0].content.parts[0].text;
    }

    function appendMessage(sender, text) {
        const isUser = sender === 'user';
        const msgDiv = document.createElement('div');
        msgDiv.className = `flex items-start gap-3 ${isUser ? 'flex-row-reverse' : ''} max-w-xl ${isUser ? 'mr-auto' : 'ml-auto'}`;

        msgDiv.innerHTML = `
            <div class="w-8 h-8 rounded-full ${isUser ? 'bg-emerald-600' : 'bg-indigo-600'} flex items-center justify-center text-sm font-bold flex-shrink-0">
                ${isUser ? 'تۆ' : 'AI'}
            </div>
            <div class="bg-slate-800 p-4 rounded-2xl border ${isUser ? 'border-emerald-500/30' : 'border-slate-700'} space-y-1">
                <p class="text-xs font-semibold ${isUser ? 'text-emerald-400' : 'text-indigo-300'}">${isUser ? 'تۆ' : 'Kurd AI'}</p>
                <p class="text-slate-200 text-sm leading-relaxed">${escapeHtml(text)}</p>
            </div>
        `;

        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendLoading() {
        const id = 'loading-' + Date.now();
        const msgDiv = document.createElement('div');
        msgDiv.id = id;
        msgDiv.className = 'flex items-start gap-3 max-w-xl ml-auto';
        msgDiv.innerHTML = `
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-sm font-bold flex-shrink-0">AI</div>
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                <p class="text-slate-400 text-sm animate-pulse">کورد AI بیر دەکاتەوە...</p>
            </div>
        `;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return id;
    }

    function removeLoading(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Voice Synthesizer (دەنگ)
    function speakText(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ckb';
            window.speechSynthesis.speak(utterance);
        }
    }

    // Voice Recognition (مایک)
    function toggleMic() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert('وێبگەڕەکەت پشتیوانی تۆمارکردنی دەنگ ناکات.');
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'ckb-IQ'; // کوردی
        recognition.interimResults = false;

        recognition.onstart = () => {
            document.getElementById('micBtn').classList.add('bg-red-600');
        };

        recognition.onresult = (e) => {
            userInput.value = e.results[0][0].transcript;
            document.getElementById('micBtn').classList.remove('bg-red-600');
        };

        recognition.onerror = () => {
            document.getElementById('micBtn').classList.remove('bg-red-600');
        };

        recognition.onend = () => {
            document.getElementById('micBtn').classList.remove('bg-red-600');
        };

        recognition.start();
    }
</script>
